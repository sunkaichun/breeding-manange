server:
  port: 8080

spring:
  application:
    name: breeding-ai-backend
  datasource:
    url: ${MYSQL_URL:jdbc:mysql://127.0.0.1:3306/app_dev?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true}
    username: ${MYSQL_USER:dev}
    password: ${MYSQL_PASSWORD:devpass}
    driver-class-name: com.mysql.cj.jdbc.Driver

management:
  endpoints:
    web:
      exposure:
        include: health,info

breeding:
  storage:
    provider: ${BREEDING_STORAGE_PROVIDER:memory}
  ai:
    provider: openai
    max-attempts: 2
    static-json-response: '{"answer":"AI model integration is disabled.","citations":[]}'
    openai:
      enabled: true
      model: gpt-5.4
      api-key: ${OPENAI_API_KEY:}
      base-url: ${OPENAI_BASE_URL:}
      organization: ${OPENAI_ORGANIZATION:}
      project: ${OPENAI_PROJECT:}
      timeout: 30s
      client-max-retries: 2
      max-attempts: 2
  lark:
    bot:
      app:
        app-id: ${LARK_BOT_APP_ID:}
        app-secret: ${LARK_BOT_APP_SECRET:}
        verification-token: ${LARK_BOT_VERIFICATION_TOKEN:}
        encrypt-key: ${LARK_BOT_ENCRYPT_KEY:}
        bot-open-id: ${LARK_BOT_OPEN_ID:}
      consumer:
        enabled: ${LARK_BOT_CONSUMER_ENABLED:false}
        cli-path: ${LARK_CLI_PATH:lark-cli}
        event-key: ${LARK_BOT_EVENT_KEY:im.message.receive_v1}
        identity: ${LARK_BOT_EVENT_IDENTITY:BOT}
        max-events: ${LARK_BOT_MAX_EVENTS:0}
        timeout: ${LARK_BOT_EVENT_TIMEOUT:}
        jq-expression: ${LARK_BOT_EVENT_JQ:}
        ready-timeout: ${LARK_BOT_READY_TIMEOUT:10s}
      queue-delay: 500ms
      queue-threads: 2
