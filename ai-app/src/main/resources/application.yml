server:
  port: 8080

spring:
  application:
    name: breeding-ai-backend

management:
  endpoints:
    web:
      exposure:
        include: health,info

breeding:
  ai:
    provider: openai
    max-attempts: 2
    static-json-response: '{"answer":"AI model integration is disabled.","citations":[]}'
    openai:
      enabled: true
      model: gpt-5.4
      api-key: ${OPENAI_API_KEY:}
      base-url: ${OPENAI_BASE_URL:}
      organization: ${OPENAI_ORGANIZATION:}
      project: ${OPENAI_PROJECT:}
      timeout: 30s
      client-max-retries: 2
      max-attempts: 2
  lark:
    bot:
      queue-delay: 500ms
      queue-threads: 2
