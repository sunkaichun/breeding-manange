server:
  port: 8080

spring:
  application:
    name: breeding-ai-backend

management:
  endpoints:
    web:
      exposure:
        include: health,info

breeding:
  ai:
    provider: static
    max-attempts: 2
    static-json-response: '{"answer":"AI model integration is disabled.","citations":[]}'
    openai:
      enabled: false
      model: gpt-5.2
      max-attempts: 2
